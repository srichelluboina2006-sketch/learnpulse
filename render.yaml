services:
  - type: web
    name: learnpulse
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        value: super_secret_learnpulse_jwt_key_2026
      - key: NODE_ENV
        value: production

